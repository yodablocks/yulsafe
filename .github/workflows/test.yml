name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Foundry build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1.9.1
        with:
          version: v1.8.3

      - name: Show Forge version
        run: forge --version

      - name: Lint
        run: forge lint -D warnings

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv

  zksync:
    name: zkSync Era build and test (zksolc)
    runs-on: ubuntu-latest
    env:
      FOUNDRY_PROFILE: zksync
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry-ZKsync
        uses: dutterbutter/foundry-zksync-toolchain@v2
        with:
          version: latest

      - name: Show Forge version
        run: forge --version

      - name: Build with zksolc
        run: forge build --sizes

      - name: Test on EraVM
        run: forge test -vvv

  via-ir:
    name: via-IR build and test (solc 0.8.36)
    runs-on: ubuntu-latest
    env:
      FOUNDRY_PROFILE: viair
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1.9.1
        with:
          version: v1.8.3

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv

  slither:
    name: Slither static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1.9.1
        with:
          version: v1.8.3

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Slither
        run: pip install --quiet slither-analyzer==0.11.6

      - name: Slither
        run: slither . --fail-low

  aderyn:
    name: Aderyn static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Aderyn 0.6.8
        run: |
          curl -sL -o aderyn.tar.xz https://github.com/Cyfrin/aderyn/releases/download/aderyn-v0.6.8/aderyn-x86_64-unknown-linux-gnu.tar.xz
          echo "ffd6ca658962e211a3ac821c646f69c8e14bf1b1001cbfe091bcd4535a691e46  aderyn.tar.xz" | sha256sum -c -
          tar xf aderyn.tar.xz
          echo "$PWD/aderyn-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"

      - name: Aderyn
        run: aderyn --skip-update-check -o aderyn-report.json

      - name: Fail on any finding not triaged in aderyn.toml
        run: |
          python3 - <<'PY'
          import json, sys
          r = json.load(open("aderyn-report.json"))
          counts = r["issue_count"]
          print("issue counts:", counts)
          for sev in ("high_issues", "low_issues"):
              for i in r.get(sev, {}).get("issues", []):
                  print(f"  {sev}: {i['detector_name']}: {i['title']}")
          sys.exit(1 if sum(counts.values()) else 0)
          PY
