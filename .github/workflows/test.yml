name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Foundry build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1.9.1
        with:
          version: v1.8.3

      - name: Show Forge version
        run: forge --version

      - name: Lint
        run: forge lint -D warnings

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv

  zksync:
    name: zkSync Era build and test (zksolc)
    runs-on: ubuntu-latest
    env:
      FOUNDRY_PROFILE: zksync
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry-ZKsync
        uses: dutterbutter/foundry-zksync-toolchain@v2
        with:
          version: latest

      - name: Show Forge version
        run: forge --version

      - name: Build with zksolc
        run: forge build --sizes

      - name: Test on EraVM
        run: forge test -vvv

  via-ir:
    name: via-IR build and test (solc 0.8.36)
    runs-on: ubuntu-latest
    env:
      FOUNDRY_PROFILE: viair
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1.9.1
        with:
          version: v1.8.3

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv

  slither:
    name: Slither static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1.9.1
        with:
          version: v1.8.3

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Slither
        run: pip install --quiet slither-analyzer==0.11.6

      - name: Slither
        run: slither . --fail-low

  aderyn:
    name: Aderyn static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cyfrin removed the prebuilt binaries from the 0.6.8 release, so build it
      # from the release source tarball, pinned by hash. rust-toolchain.toml in
      # the tarball pins the nightly, and --locked holds Cargo.lock, which pins
      # the one git dependency to a commit. The binary is cached by source hash.
      - name: Cache Aderyn 0.6.8 build
        id: aderyn-cache
        uses: actions/cache@v4
        with:
          path: ~/aderyn-bin
          key: aderyn-0.6.8-src-2d4afdb52bae30f8488e5d9470a281d284c0b286455b61b474e6c2e7dafe343a

      - name: Build Aderyn 0.6.8 from source
        if: steps.aderyn-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/aderyn-src ~/aderyn-bin
          cd ~/aderyn-src
          curl -fsSL -o source.tar.gz https://github.com/Cyfrin/aderyn/releases/download/aderyn-v0.6.8/source.tar.gz
          echo "2d4afdb52bae30f8488e5d9470a281d284c0b286455b61b474e6c2e7dafe343a  source.tar.gz" | sha256sum -c -
          tar xzf source.tar.gz
          cd aderyn-0.6.8
          cargo build --release --locked -p aderyn --bin aderyn
          cp target/release/aderyn ~/aderyn-bin/

      - name: Put Aderyn on the path
        run: |
          echo "$HOME/aderyn-bin" >> "$GITHUB_PATH"
          "$HOME/aderyn-bin/aderyn" --version

      - name: Aderyn
        run: aderyn --skip-update-check -o aderyn-report.json

      - name: Fail on any finding not triaged in aderyn.toml
        run: |
          python3 - <<'PY'
          import json, sys
          r = json.load(open("aderyn-report.json"))
          counts = r["issue_count"]
          print("issue counts:", counts)
          for sev in ("high_issues", "low_issues"):
              for i in r.get(sev, {}).get("issues", []):
                  print(f"  {sev}: {i['detector_name']}: {i['title']}")
          sys.exit(1 if sum(counts.values()) else 0)
          PY
