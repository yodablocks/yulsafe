[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.37"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10_000_000
via_ir = false
ignored_warnings_from = ["lib"]
gas_reports = ["YulSafeERC20", "SoladyVault", "PlainPackedVault"]

[invariant]
runs = 256
depth = 50
fail_on_revert = false
shrink_run_limit = 5000

# zkSync Era: compiled with zksolc through foundry-zksync.
# Matter Labs' patched solc stops at 0.8.30, so this profile pins it.
# The invariant harness drives cheatcodes from a non-test contract, which the
# EraVM emulator does not support, so it is excluded here and covered by the
# default profile.
[profile.zksync]
src = "src"
out = "out-zksync"
libs = ["lib"]
solc = "0.8.30"
optimizer = true
optimizer_runs = 10_000_000
via_ir = false
ignored_warnings_from = ["lib"]
no_match_path = "test/invariants/*"
fuzz = { runs = 64 }

# zksolc is left unpinned on purpose: pinning it makes the fork fail to
# fetch the patched solc. foundry-zksync v0.1.4 bundles zksolc 1.5.15.
[profile.zksync.zksync]
compile = true
startup = true
suppressed_warnings = ["assemblycreate"]

[rpc_endpoints]
zksync_sepolia = "https://sepolia.era.zksync.dev"

[etherscan]
zksync_sepolia = { key = "${ZKSYNC_ETHERSCAN_API_KEY}", url = "https://api-sepolia.explorer.zksync.io/api" }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[profile.ci]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.37"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10_000_000
via_ir = false
ignored_warnings_from = ["lib"]
fuzz = { runs = 512 }

# Optimized via-IR pipeline on solc 0.8.36, the configuration oksolc claims
# byte-compatibility with. Used to compare its output against upstream solc.
[profile.viair]
src = "src"
out = "out-viair"
libs = ["lib"]
solc = "0.8.36"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
ignored_warnings_from = ["lib"]
fuzz = { runs = 256 }
